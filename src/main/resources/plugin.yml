name: PlexonBlacksmith
version: '${project.version}'
main: dev.plexon.blacksmith.PlexonBlacksmithPhase3
api-version: '1.21'
author: ZpkDxGames
description: Phase 3 player UX over the exact-item repair, combine and enchanting workstation for Paper 26.2.
softdepend:
  - PlexonCore
  - Vault
commands:
  blacksmith:
    description: Opens the Plexon Blacksmith workstation.
    usage: /blacksmith [diagnostics|reload]
    permission: plexon.blacksmith.use
permissions:
  plexon.blacksmith.use:
    description: Allows use of the Plexon Blacksmith workstation.
    default: true
  plexon.blacksmith.admin:
    description: Allows diagnostics and safe configuration reloads.
    default: op
