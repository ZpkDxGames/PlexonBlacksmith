name: PlexonBlacksmith
version: '${project.version}'
main: dev.plexon.blacksmith.PlexonBlacksmithBridge
api-version: '1.21'
author: ZpkDxGames
description: Direct cached-input Blacksmith GUI for Paper 26.2 with optional PlexonCore integration.
softdepend:
  - PlexonCore
  - Vault
commands:
  blacksmith:
    description: Opens the Plexon Blacksmith forge.
    usage: /blacksmith [diagnostics|reload]
    permission: plexon.blacksmith.use
permissions:
  plexon.blacksmith.use:
    description: Allows use of the Plexon Blacksmith GUI.
    default: true
  plexon.blacksmith.admin:
    description: Allows PlexonBlacksmith diagnostics and reload operations.
    default: op
