# PlexonBlacksmith 2.0 workstation configuration.
# TheosisEconomy remains authoritative through Vault. Blacksmith never registers an economy provider.
features:
  combine: true
  enchant: true

confirmation:
  timeout-seconds: 6
  expensive-threshold: 1000.0
  combine-always: true
  enchant-always: true

pricing:
  repair:
    minimum: 25.0
    full:
      netherite: 2400.0
      diamond: 1200.0
      elytra: 2000.0
      trident: 1600.0
      iron: 350.0
      gold: 180.0
      stone: 120.0
      wood: 80.0
      ranged: 450.0
      default: 500.0
  combine:
    base: 125.0
    durability-bonus-percent: 12.0
    repair-value-multiplier: 0.35
  enchant:
    base: 100.0
    rates:
      rare: 400.0
      premium: 225.0
      common: 125.0
      default: 75.0
