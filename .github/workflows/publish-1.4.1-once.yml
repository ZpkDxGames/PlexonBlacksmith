name: Publish PlexonBlacksmith 1.4.1 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.4.1-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Provision PlexonCore 2.0.4
        run: |
          curl -fsSL -o /tmp/PlexonCore-2.0.4.jar https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  /tmp/PlexonCore-2.0.4.jar' | sha256sum -c -
          mvn -B install:install-file -Dfile=/tmp/PlexonCore-2.0.4.jar -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Verify exact release
        run: mvn -B clean verify
      - name: Verify distribution
        run: |
          set -euo pipefail
          JAR=target/PlexonBlacksmith-1.4.1.jar
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -F "version: '1.4.1'"
          if jar tf "$JAR" | grep -q '^com/zpkdxgames/plexoncore/'; then exit 1; fi
          sha256sum "$JAR" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish v1.4.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.4.1 >/dev/null 2>&1; then exit 0; fi
          gh release create v1.4.1 target/PlexonBlacksmith-1.4.1.jar SHA256SUMS.txt --target "$GITHUB_SHA" --title 'PlexonBlacksmith 1.4.1' --notes-file .release/1.4.1.md
