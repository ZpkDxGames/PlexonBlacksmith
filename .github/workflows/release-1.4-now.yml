name: Publish PlexonBlacksmith 1.4.0 now

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-1.4-now.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA='f30ca1a97a7e90dcf8306ae7a258c6f51e486f08'
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v1.4.0 >/dev/null; then
            echo 'v1.4.0 already exists; refusing to overwrite it.' >&2
            exit 1
          fi

      - name: Provision PlexonCore 1.0.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/PlexonCore-1.0.0.jar \
            https://github.com/ZpkDxGames/PlexonCore/releases/download/v1.0.0/PlexonCore-1.0.0.jar
          echo '4abce6de93293e21b31cb874734430d5bdc77de17a4c3b98fd6a9006e1f13018  /tmp/PlexonCore-1.0.0.jar' | sha256sum -c -
          mvn -B install:install-file \
            -Dfile=/tmp/PlexonCore-1.0.0.jar \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=1.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build and verify
        run: mvn -B clean verify

      - name: Verify plugin metadata
        shell: bash
        run: |
          set -euo pipefail
          unzip -p target/PlexonBlacksmith-1.4.0.jar plugin.yml | grep -F "version: '1.4.0'"
          unzip -p target/PlexonBlacksmith-1.4.0.jar plugin.yml | grep -F '  - PlexonCore'

      - name: Verify Core is not shaded
        shell: bash
        run: |
          set -euo pipefail
          if jar tf target/PlexonBlacksmith-1.4.0.jar | grep -q '^com/zpkdxgames/plexoncore/'; then
            echo 'PlexonCore classes were shaded into PlexonBlacksmith.' >&2
            exit 1
          fi

      - name: Diff check
        run: git diff --check

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd target
          sha256sum PlexonBlacksmith-1.4.0.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Tag verified target and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA='f30ca1a97a7e90dcf8306ae7a258c6f51e486f08'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.4.0 "$TARGET_SHA" -m 'PlexonBlacksmith 1.4.0'
          git push origin refs/tags/v1.4.0
          gh release create v1.4.0 \
            target/PlexonBlacksmith-1.4.0.jar \
            target/SHA256SUMS.txt \
            --title 'PlexonBlacksmith 1.4.0' \
            --notes-file docs/RELEASE_1_4.md

      - name: Remove one-shot workflow from main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-1.4-now.yml
          git commit -m 'Remove one-shot 1.4 release workflow'
          git push origin HEAD:main
