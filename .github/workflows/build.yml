name: Build
on:
  push:
    branches: [main, 'phase2/**', 'phase3/**']
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
env:
  PLUGIN_VERSION: 2.0.0-rc.2
  PHASE2_SHA: 475f1e8005fd6ed5f9118be7385473a69a574b05
  ACCEPTED_PHASE3_SHA: f46290bc0192945c3f1f8db51bf6b6b58d69414c
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25', cache: maven}
      - name: Provision PlexonCore 2.0.4
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/PlexonCore-2.0.4.jar https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  /tmp/PlexonCore-2.0.4.jar' | sha256sum -c -
          mvn -B install:install-file -Dfile=/tmp/PlexonCore-2.0.4.jar -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Verify candidate ancestry and dependencies
        run: |
          set -euo pipefail
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" = "$PLUGIN_VERSION"
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=plexoncore.version)" = 2.0.4
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=paper.version)" = 26.2.build.111-stable
          git merge-base --is-ancestor "$PHASE2_SHA" HEAD
          git merge-base --is-ancestor "$ACCEPTED_PHASE3_SHA" HEAD
      - name: Verify
        run: mvn -B clean verify
      - name: Build exact test summary
        run: |
          python3 - <<'PY'
          import glob,pathlib,xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              for c in ET.parse(p).getroot().iter('testcase'): t+=1; f+=c.find('failure') is not None; e+=c.find('error') is not None; s+=c.find('skipped') is not None
          if not t or f or e or s: raise SystemExit(f'{t=} {f=} {e=} {s=}')
          pathlib.Path('target/TEST_SUMMARY.txt').write_text(f'tests={t}\nfailures={f}\nerrors={e}\nskipped={s}\n'); print(f'Tests: {t}; failures=0; errors=0; skipped=0')
          PY
      - name: Verify distribution and isolation
        run: |
          set -euo pipefail
          JAR=target/PlexonBlacksmith-${PLUGIN_VERSION}.jar; test -s "$JAR"; jar tf "$JAR" > target/jar-contents.txt
          unzip -p "$JAR" plugin.yml | grep -F "version: '${PLUGIN_VERSION}'"; unzip -p "$JAR" plugin.yml | grep -F 'api-version:'
          unzip -p "$JAR" plugin.yml | grep -F 'main: dev.plexon.blacksmith.PlexonBlacksmithPhase3'
          javap -verbose -classpath "$JAR" dev.plexon.blacksmith.PlexonBlacksmithPhase3 | grep -F 'major version: 69'
          for prefix in 'com/zpkdxgames/plexoncore/' 'net/milkbowl/vault/' 'me/clip/placeholderapi/' 'net/luckperms/api/'; do if grep -q "^$prefix" target/jar-contents.txt; then exit 1; fi; done
          (cd target && sha256sum "PlexonBlacksmith-${PLUGIN_VERSION}.jar" > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Provenance
        run: |
          JAR=target/PlexonBlacksmith-${PLUGIN_VERSION}.jar; size=$(stat -c%s "$JAR"); digest=$(sha256sum "$JAR"|awk '{print $1}'); { echo repository=$GITHUB_REPOSITORY; echo candidate_sha=$GITHUB_SHA; echo accepted_phase3=$ACCEPTED_PHASE3_SHA; echo version=$PLUGIN_VERSION; echo java=25; echo class_major=69; echo paper=26.2; echo plexoncore=2.0.4; echo jar_size=$size; echo jar_sha256=$digest; echo runtime_certification=NOT_EXECUTED; } > target/PROVENANCE.txt
      - name: Diff check
        run: git diff --check "${PHASE2_SHA}...HEAD"
      - uses: actions/upload-artifact@v4
        with:
          name: PlexonBlacksmith-${{ env.PLUGIN_VERSION }}-${{ github.sha }}
          path: |
            target/PlexonBlacksmith-${{ env.PLUGIN_VERSION }}.jar
            target/SHA256SUMS.txt
            target/TEST_SUMMARY.txt
            target/PROVENANCE.txt
          if-no-files-found: error
