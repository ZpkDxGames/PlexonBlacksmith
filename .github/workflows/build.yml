name: Build

on:
  push:
    branches:
      - main
      - 'phase2/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Provision PlexonCore 2.0.4
        run: |
          curl -fsSL -o /tmp/PlexonCore-2.0.4.jar \
            https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  /tmp/PlexonCore-2.0.4.jar' | sha256sum -c -
          mvn -B install:install-file \
            -Dfile=/tmp/PlexonCore-2.0.4.jar \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=2.0.4 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Verify
        run: mvn -B clean verify

      - name: Verify distribution
        run: |
          set -euo pipefail
          JAR=target/PlexonBlacksmith-2.0.0-rc.1.jar
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -F "version: '2.0.0-rc.1'"
          unzip -p "$JAR" plugin.yml | grep -F '  - PlexonCore'
          unzip -p "$JAR" config.yml | grep -F 'combine: true'
          if jar tf "$JAR" | grep -q '^com/zpkdxgames/plexoncore/'; then
            echo 'PlexonCore classes were shaded into PlexonBlacksmith.' >&2
            exit 1
          fi

      - name: Diff check
        run: git diff --check

      - name: Checksums
        run: |
          cd target
          sha256sum PlexonBlacksmith-2.0.0-rc.1.jar > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PlexonBlacksmith-2.0.0-rc.1
          path: |
            target/PlexonBlacksmith-2.0.0-rc.1.jar
            target/SHA256SUMS.txt
          if-no-files-found: error
