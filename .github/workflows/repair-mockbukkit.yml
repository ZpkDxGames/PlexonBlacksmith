name: Repair MockBukkit compatibility

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/repair-mockbukkit.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unnecessary final modifier
        shell: bash
        run: |
          set -euo pipefail
          FILE='src/main/java/dev/plexon/blacksmith/PlexonBlacksmithBridge.java'
          grep -q 'public final class PlexonBlacksmithBridge' "$FILE"
          sed -i 's/public final class PlexonBlacksmithBridge/public class PlexonBlacksmithBridge/' "$FILE"
          grep -q 'public class PlexonBlacksmithBridge' "$FILE"
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/dev/plexon/blacksmith/PlexonBlacksmithBridge.java
          git commit -m 'Fix MockBukkit runtime test compatibility'
          git push origin HEAD:main
